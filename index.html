<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="人生重开模拟器：抽天赋、分属性，随机体验一段人生。">
<title>人生重开</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 像素冒险风：刻意只做一套夜色主题 */
:root{
  color-scheme:dark;
  --bg:#13132A; --bg-2:#1B1B3B; --panel:#24244A; --panel-2:#2E2E5E; --panel-3:#3A3A72;
  --line:#08081A; --hi:rgba(255,255,255,.12);
  --ink:#F5F3FF; --ink-2:#B8B5E4; --ink-3:#7E7BB4;
  --gold:#FFD15C; --gold-d:#C98A12; --red:#FF5F6D; --red-d:#A72C3B; --green:#5BE49B; --blue:#5AB8FF; --purple:#B884FF; --orange:#FFA94D; --pink:#FF7AC3;
  --a-CHR:#FF7AC3; --a-INT:#5AB8FF; --a-STR:#FF5F6D; --a-MNY:#FFD15C; --a-SPR:#5BE49B;
  --r0:#C3C3DC; --r1:#5AB8FF; --r2:#B884FF; --r3:#FFB020; --r4:#FF7AC3;
  --t0:#FF5F6D; --t1:#FF8A5B; --t2:#9C99C8; --t3:#E9E7FF; --t4:#5AB8FF; --t5:#B884FF; --t6:#FFD15C;
  --f-title:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-px:"Pixelify Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --drop:0 5px 0 0 rgba(0,0,0,.45);
}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--bg-2),var(--bg) 70%) fixed;color:var(--ink);font:15px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-inline:16px;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{display:flex;flex-direction:column;flex:1;padding-block:16px 28px;gap:18px}
.px{background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 3px 0 var(--hi),inset 0 -3px 0 rgba(0,0,0,.25),var(--drop)}

/* 顶栏 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--f-title);font-weight:400;font-size:20px;color:var(--ink)}
.mark i{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--gold);color:#2A1A00;font-style:normal;font-size:17px;border:3px solid var(--line);box-shadow:inset 0 -3px 0 var(--gold-d)}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip-btn{font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.04em;background:var(--panel-2);border:3px solid var(--line);padding:3px 10px;color:var(--ink-2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.chip-btn:hover{color:var(--ink);background:var(--panel-3)}
.chip-btn b{font-family:var(--f-px);font-weight:600;color:var(--gold)}

/* 按钮 */
.btn{font-family:var(--f-ui);font-weight:700;font-size:19px;letter-spacing:.08em;padding:11px 18px 14px;border:3px solid var(--line);border-radius:0;color:#2A1A00;background:var(--gold);box-shadow:inset 0 -5px 0 var(--gold-d),inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--line);position:relative;top:0;transition:filter .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{top:3px;box-shadow:inset 0 -2px 0 var(--gold-d),inset 0 3px 0 rgba(255,255,255,.35),0 1px 0 var(--line)}
.btn-ghost{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 -5px 0 #24245A,inset 0 3px 0 rgba(255,255,255,.14),0 4px 0 var(--line)}
.btn-ghost:active{box-shadow:inset 0 -2px 0 #24245A,0 1px 0 var(--line)}
.btn:disabled{background:#34344F;color:#77779A;box-shadow:inset 0 -5px 0 #26263B,0 4px 0 var(--line);cursor:not-allowed;filter:none;top:0}
.btn[aria-pressed="true"]{background:var(--green);color:#062A17;box-shadow:inset 0 -5px 0 #2C9C63,inset 0 3px 0 rgba(255,255,255,.4),0 4px 0 var(--line)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 130px}

.h2{font-family:var(--f-title);font-weight:400;font-size:26px;letter-spacing:.06em;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--line);text-wrap:balance}
.sub{color:var(--ink-2);font-size:13.5px;margin:2px 0 0}
.label{font-family:var(--f-ui);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--ink-2)}
.label::before{content:"◆ ";color:var(--gold)}

/* 首页 */
.logo{display:grid;justify-items:center;text-align:center;gap:2px;padding-top:3vh}
.logo-sub{font-family:var(--f-px);font-weight:700;font-size:15px;letter-spacing:.42em;color:var(--blue);padding-left:.42em}
.logo-title{font-family:var(--f-title);font-weight:400;font-size:clamp(60px,17vw,104px);line-height:1.05;margin:0;color:var(--gold);letter-spacing:.06em;text-shadow:4px 4px 0 var(--red-d),8px 8px 0 var(--line)}
.logo-ver{font-family:var(--f-ui);font-weight:700;font-size:16px;color:var(--ink-2);letter-spacing:.3em;padding-left:.3em}
.start-wrap{display:grid;justify-items:center;gap:10px}
.btn-start{font-size:24px;padding:14px 40px 17px;min-width:min(280px,100%)}
.blink{font-family:var(--f-px);font-weight:600;font-size:13px;letter-spacing:.3em;color:var(--ink-3);margin:0;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.tagline{color:var(--ink-2);text-align:center;margin:0 auto;max-width:32em;font-size:14.5px}
.hud-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hud-stats div{padding:8px 6px 10px;text-align:center}
.hud-stats b{display:block;font-family:var(--f-px);font-weight:700;font-size:22px;line-height:1.2;color:var(--gold)}
.hud-stats span{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--ink-2);letter-spacing:.06em}
.quests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:0;list-style:none}
.quests li{padding:10px 12px 12px;font-size:13px;color:var(--ink-2);line-height:1.55}
.quests small{display:block;font-family:var(--f-px);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--blue)}
.quests b{display:block;font-family:var(--f-title);font-weight:400;font-size:18px;color:var(--ink);margin-bottom:2px}
@media (max-width:460px){.hud-stats{grid-template-columns:repeat(2,1fr)}.quests{grid-template-columns:1fr}}

/* 对话框式人生记录 */
.dialog{position:relative;background:linear-gradient(var(--panel),#1F1F42);padding:4px 0}
.dialog-tag{position:absolute;top:-14px;left:12px;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em;background:var(--blue);color:#06233D;border:3px solid var(--line);padding:0 8px;line-height:20px}
.log{list-style:none;margin:0;padding:8px 0}
.log li{display:grid;grid-template-columns:64px 1fr;gap:0;padding:7px 0;border-bottom:2px dashed rgba(184,181,228,.12)}
.log li:last-child{border-bottom:0}
.log .age{font-family:var(--f-px);font-weight:700;font-size:16px;color:var(--gold);text-align:right;padding-right:12px;white-space:nowrap;line-height:1.6}
.log .age small{font-family:var(--f-ui);font-weight:700;font-size:12px;font-weight:400;color:var(--ink-3);margin-left:1px}
.log .txt{padding-right:14px;min-width:0}
.log .txt p{margin:0}
.log .tal{color:var(--purple)}
.log .dead{color:var(--red);font-weight:700}
.log li.new{animation:pop-in .3s steps(4,end);background:rgba(255,209,92,.06)}
.log li.cur .txt>p:last-of-type::after{content:" ▼";color:var(--gold);font-size:11px;animation:blink 1s steps(2,start) infinite}
@keyframes pop-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* 天赋卡（抽卡） */
.odds{display:flex;gap:6px;flex-wrap:wrap}
.odds span{font-family:var(--f-px);font-weight:600;font-size:12px;padding:1px 7px;border:2px solid var(--line);background:var(--panel-2);color:var(--rc)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{--rc:var(--r0);position:relative;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 16%,var(--panel)),var(--panel) 60%);border:3px solid var(--line);outline:3px solid var(--rc);outline-offset:-6px;padding:12px 14px 13px;display:grid;gap:3px;min-height:80px;box-shadow:var(--drop);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card[data-g="1"]{--rc:var(--r1)} .card[data-g="2"]{--rc:var(--r2)} .card[data-g="3"]{--rc:var(--r3)} .card[data-g="4"]{--rc:var(--r4)}
.card[data-g="3"],.card[data-g="4"]{box-shadow:var(--drop),0 0 18px -2px color-mix(in srgb,var(--rc) 70%,transparent)}
.card[data-g="4"]{outline:none;background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 18%,var(--panel)),var(--panel) 60%) padding-box,linear-gradient(115deg,var(--blue),var(--purple),var(--pink),var(--gold),var(--blue)) border-box;border:4px solid transparent;background-size:100% 100%,300% 100%;animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:0 0,300% 0}}
.card .nm{font-family:var(--f-title);font-weight:400;font-size:19px;color:var(--rc);letter-spacing:.04em;padding-right:44px;line-height:1.3}
.card .rk{position:absolute;top:8px;right:10px;font-family:var(--f-px);font-weight:700;font-size:13px;color:var(--line);background:var(--rc);padding:0 5px;line-height:18px}
.card[data-g="4"] .rk{background:linear-gradient(90deg,var(--blue),var(--pink),var(--gold))}
.card .ds{font-size:13px;color:var(--ink-2);line-height:1.5}
.card .inh{font-family:var(--f-ui);font-weight:700;font-size:12px;color:var(--green);letter-spacing:.06em}
.card.on{transform:translateY(-3px);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 30%,var(--panel-2)),var(--panel-2) 70%)}
.card[data-g="4"].on{background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 32%,var(--panel-2)),var(--panel-2) 70%) padding-box,linear-gradient(115deg,var(--blue),var(--purple),var(--pink),var(--gold),var(--blue)) border-box;background-size:100% 100%,300% 100%}
.card.on::after{content:"已选";position:absolute;left:-6px;bottom:-8px;font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.1em;color:#2A1A00;background:var(--gold);border:3px solid var(--line);padding:0 7px;line-height:20px}
.card.back{--rc:var(--panel-3);cursor:default;background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px;display:grid;place-items:center}
.card.back::before{content:"?";font-family:var(--f-px);font-weight:700;font-size:30px;color:var(--ink-3)}
.card.flip{animation:flip .35s steps(5,end) both}
.card[data-g="4"].flip{animation:flip .35s steps(5,end) both,shimmer 3s linear infinite}
@keyframes flip{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}

/* 属性分配 */
.alloc{display:grid;gap:12px;padding:14px}
.arow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.an{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:17px;min-width:76px}
.badge{--ac:var(--gold);display:inline-grid;place-items:center;width:26px;height:26px;background:var(--ac);color:var(--line);border:3px solid var(--line);font-family:var(--f-ui);font-weight:700;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;min-width:0}
.cells i{height:16px;background:var(--bg);border:2px solid var(--line)}
.cells i.f{background:var(--ac);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border:3px solid var(--line);background:var(--panel-3);font-family:var(--f-px);font-weight:700;font-size:18px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.stepper button:active{box-shadow:none}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:44px;text-align:center;font-family:var(--f-px);font-weight:700;font-size:20px}
.stepper output small{font-size:12px;color:var(--green)}
.points{display:flex;align-items:baseline;gap:10px;font-family:var(--f-ui);font-weight:700;font-size:17px}
.points b{font-family:var(--f-px);font-weight:700;font-size:34px;color:var(--gold);line-height:1;text-shadow:3px 3px 0 var(--line)}
.picked{display:flex;gap:8px;flex-wrap:wrap}
.pill{--rc:var(--r0);font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.03em;padding:1px 10px;border:3px solid var(--line);background:var(--panel-2);color:var(--rc)}
.pill[data-g="1"]{--rc:var(--r1)} .pill[data-g="2"]{--rc:var(--r2)} .pill[data-g="3"]{--rc:var(--r3)} .pill[data-g="4"]{--rc:var(--r4)}

/* 人生进行中 */
.life{height:100%;min-height:0;padding-block:12px 0;gap:12px}
#app:has(> .life){height:100%}
.hud{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:stretch;padding:8px 10px 10px}
.hud-age{display:grid;place-content:center;text-align:center;padding-right:12px;border-right:3px dashed rgba(184,181,228,.18)}
.hud-age b{font-family:var(--f-px);font-weight:700;font-size:30px;line-height:1;color:var(--gold)}
.hud-age span{font-family:var(--f-ui);font-weight:700;font-size:12px;color:var(--ink-2)}
.attrs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.attr{--ac:var(--gold);position:relative;display:grid;gap:3px;min-width:0}
.attr-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.attr .badge{width:22px;height:22px;font-size:13px;border-width:2px}
.attr b{font-family:var(--f-px);font-weight:700;font-size:19px;line-height:1}
.meter{height:8px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac);transition:width .3s steps(4,end)}
.attr em{position:absolute;right:0;top:-14px;font-family:var(--f-px);font-style:normal;font-size:12px;font-weight:700;animation:float 1.2s ease-out forwards;text-shadow:2px 2px 0 var(--line)}
.attr em.u{color:var(--green)} .attr em.d{color:var(--red)}
@keyframes float{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.logwrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;cursor:pointer;padding:16px 3px 8px}
.controls{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 35%);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
.controls .btn{flex:1 1 90px;font-size:17px;padding:10px 8px 13px}

/* 抉择菜单 */
.choices{display:grid;gap:6px;margin:8px 0 4px;padding:8px;background:var(--bg);border:3px solid var(--line)}
.choice-btn{display:flex;align-items:center;gap:8px;text-align:left;font-family:var(--f-ui);font-weight:700;font-size:16px;letter-spacing:.03em;background:none;border:0;padding:4px 8px;color:var(--ink)}
.choice-btn::before{content:"▶";font-size:11px;color:transparent}
.choice-btn:hover,.choice-btn:focus-visible{background:var(--panel-2);color:var(--gold);outline:none}
.choice-btn:hover::before,.choice-btn:focus-visible::before{color:var(--gold)}

/* 结算 */
.result{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px}
.rank{--tc:var(--t3);display:grid;place-items:center;width:104px;height:104px;background:var(--bg);border:3px solid var(--line);outline:3px solid var(--tc);outline-offset:-8px;animation:slam .45s steps(6,end) .15s both}
.rank b{font-family:var(--f-px);font-weight:700;font-size:58px;line-height:1;color:var(--tc);text-shadow:4px 4px 0 var(--line),0 0 18px color-mix(in srgb,var(--tc) 60%,transparent)}
.rank small{font-family:var(--f-ui);font-weight:700;font-size:14px;color:var(--tc);margin-top:-14px}
@keyframes slam{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.result .big{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1.25;margin:2px 0 6px;color:var(--ink)}
.result .score{font-family:var(--f-px);font-weight:700;font-size:15px;color:var(--gold);letter-spacing:.06em}
.result .epi{color:var(--ink-2);font-size:14px;margin:6px 0 0}
.rates{display:grid;gap:9px;padding:14px}
.rate{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.rate .an{min-width:72px}
.rate .v{font-family:var(--f-px);font-weight:700;font-size:17px;min-width:34px;text-align:right}
.tier{--tc:var(--t3);font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--tc);border:2px solid currentColor;padding:0 6px;line-height:20px;white-space:nowrap}
[data-t="0"]{--tc:var(--t0)} [data-t="1"]{--tc:var(--t1)} [data-t="2"]{--tc:var(--t2)} [data-t="3"]{--tc:var(--t3)} [data-t="4"]{--tc:var(--t4)} [data-t="5"]{--tc:var(--t5)} [data-t="6"]{--tc:var(--t6)}
.unlock{display:flex;gap:8px;flex-wrap:wrap}
.unlock .pill{--rc:var(--gold)}
.section{display:grid;gap:10px}
.inherit .cards{grid-template-columns:1fr}

/* 弹层 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,8,26,.78);display:grid;place-items:center;padding:16px}
.panel{width:min(600px,100%);max-height:86vh;overflow:auto;padding:18px;display:grid;gap:14px}
.panel-head{display:grid;gap:2px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{background:var(--bg);border:3px solid var(--line);padding:8px 10px;display:grid;gap:1px}
.ach b{font-family:var(--f-ui);font-weight:700;font-weight:400;font-size:16px}
.ach span{font-size:12px;color:var(--ink-2);line-height:1.45}
.ach.lock{opacity:.5}
.ach.got{outline:2px solid var(--gold);outline-offset:-5px}
.ach.got b{color:var(--gold)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;background:var(--bg);border:3px solid var(--line)}
.hist b{font-family:var(--f-ui);font-weight:700;font-weight:400;font-size:16px}
.hist small{color:var(--ink-3);grid-column:1/-1;font-size:12.5px}
.empty{color:var(--ink-3);font-size:14px;margin:0}
.share-box{width:100%;box-sizing:border-box;font:14px/1.7 var(--f-body);color:var(--ink);background:var(--bg);border:3px solid var(--line);padding:10px 12px;resize:vertical}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;font-family:var(--f-ui);font-weight:700;font-size:16px;letter-spacing:.04em;background:var(--panel-2);color:var(--ink);border:3px solid var(--line);outline:2px solid var(--gold);outline-offset:-6px;padding:8px 18px;box-shadow:var(--drop);max-width:calc(100% - 32px);animation:drop-in .3s steps(4,end)}
@keyframes drop-in{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div id="app"></div>
<script>
// ===== 核心常量 =====

// ===== 人生引擎（不依赖 DOM） =====
const TMAP = Object.fromEntries(TALENTS.map(t => [t.id, t]));
const EVENTS_BY_ID = Object.fromEntries(EVENTS.map(e => [e.id, e]));
const AGE_CAP = 5000;

class Life {
  constructor(ids, alloc) {
    this.talents = ids.map(id => TMAP[id]).filter(Boolean);
    this.tags = new Set(); this.ever = new Set(); this.seen = new Set();
    this.gender = Math.random() < 0.5 ? '男' : '女';
    this.species = '人'; this.ageScale = 1;
    this.life = 0; this.age = -1; this.alive = true; this.end = null;
    this.revived = false; this.reborn = false; this.dodged = false;
    this.skipYears = 0; this.delta = {}; this.pending = null; this.cur = null; this.choiceCount = 0;
    KEYS4.forEach(k => { this[k] = alloc[k] || 0; });
    this.SPR = 5;
    for (const t of this.talents) {
      if (t.eff) for (const k in t.eff) this[k] += t.eff[k];
      if (t.tag) this.add(t.tag);
      if (t.life) this.life += t.life;
      if (t.on) t.on(this);
    }
    this.init = {}; this.max = {}; this.min = {};
    KEYS5.forEach(k => { this.init[k] = this.max[k] = this.min[k] = this[k]; });
    this.history = [];
    this.snaps = { init: this.snap() };
  }
  get kid() { return this.gender === '男' ? '男孩' : '女孩'; }
  get hAge() { return this.age * this.ageScale; }
  has(t) { return this.tags.has(t); }
  tal(id) { return this.talents.some(t => t.id === id); }
  r(p) { return Math.random() < p; }
  add(t) { [].concat(t).forEach(x => { this.tags.add(x); this.ever.add(x); }); }
  del(t) { [].concat(t).forEach(x => this.tags.delete(x)); }
  chg(o) {
    for (const k in o) {
      const d = o[k];
      if (!d) continue;
      if (k === 'SPR' && d < 0 && this.tal('xinjing')) continue;
      this[k] += d;
      this.delta[k] = (this.delta[k] || 0) + d;
      if (this[k] > this.max[k]) this.max[k] = this[k];
      if (this[k] < this.min[k]) this.min[k] = this[k];
    }
  }
  val(x) { return typeof x === 'function' ? x(this) : x; }
  ok(e) { try { return !e.if || !!e.if(this); } catch (err) { return false; } }
  weight(e) { const w = e.w == null ? 1 : this.val(e.w); return w > 0 ? w : 0; }

  snap() {
    const o = { age: this.age, tags: [...this.tags], seen: [...this.seen], species: this.species, ageScale: this.ageScale, life: this.life };
    KEYS5.forEach(k => { o[k] = this[k]; });
    return o;
  }
  restore(o) {
    KEYS5.forEach(k => { this[k] = o[k]; });
    this.tags = new Set(o.tags); this.seen = new Set(o.seen);
    Object.assign(this, { age: o.age, species: o.species, ageScale: o.ageScale, life: o.life });
  }

  pick() {
    const pool = EVENTS.filter(e => !e.chain && (e.sp || '人') === this.species &&
      e.age[0] <= this.age && this.age <= e.age[1] &&
      (e.repeat || !this.seen.has(e.id)) && this.ok(e));
    const must = pool.filter(e => e.must);
    const src = must.length ? must : pool;
    let total = 0;
    const ws = src.map(e => (total += this.weight(e)));
    if (!total) return null;
    const x = Math.random() * total;
    return src[ws.findIndex(w => w > x)];
  }

  // 死亡：返回保命文字（主角光环 / 回光返照 / 重生）或 null
  die(end, final) {
    if (!final && this.has('主角') && this.age < 60) {
      this.STR = Math.max(this.STR, 1); this.add('主角不死');
      return '【主角光环】剧情需要，你又顽强地活了下来。';
    }
    if (!final && this.tal('huiguang') && !this.revived) {
      this.revived = true; this.STR = Math.max(this.STR, 2); this.add('复活过');
      return '【回光返照】就在所有人以为你不行了的时候，你又睁开了眼睛。';
    }
    if (!final && this.has('重生') && !this.reborn) {
      this.reborn = true;
      const sn = this.age >= 18 && this.snaps[17] ? this.snaps[17] : this.snaps.init;
      this.restore(sn);
      this.chg({ INT: 3, MNY: 2 });
      this.add('重生过');
      return sn.age < 0
        ? '【重生】你猛地睁开眼，发现自己又变回了一个婴儿。这一次，你什么都记得。'
        : '【重生】你猛地睁开眼，发现自己回到了十八岁那年的夏天。这一次，你什么都记得。';
    }
    this.alive = false; this.end = end || '寿终';
    return null;
  }

  push(t, cls) { this.cur.lines.push({ t, cls: cls || '' }); }

  step() {
    if (!this.alive || this.pending) return null;
    this.age += 1; this.delta = {};
    this.cur = { age: this.age, lines: [], delta: this.delta, alive: true, pending: null };
    this.history.push(this.cur);
    for (const t of this.talents) {
      if (!t.year) continue;
      const r = t.year(this);
      if (r) this.push(r, 'tal');
    }
    const e = this.pick();
    if (!e) this.push('这一年什么也没发生。');
    this.run(e, '');
    if (!this.pending) this.finish();
    return this.cur;
  }

  run(e, text) {
    let guard = 0;
    while (e && guard++ < 8) {
      const dodge = e.fatal && (this.has('主角') || (this.has('预知') && !this.dodged));
      if (dodge) {
        if (!this.has('主角')) this.dodged = true;
        this.add('躲过一劫');
        if (text) this.push(text);
        text = '';
        this.push(this.has('主角') ? '【主角光环】千钧一发之际，你毫发无伤地躲了过去。' : '【预知梦】你想起昨晚的噩梦，在最后一刻避开了这场灾祸。', 'tal');
        break;
      }
      this.seen.add(e.id);
      let t = e.text ? this.val(e.text) : '';
      if (e.eff) this.chg(e.eff);
      if (e.add) this.add(e.add);
      if (e.del) this.del(e.del);
      if (e.fx) { const r = e.fx(this); if (typeof r === 'string') t = r; }
      text += t;
      if (e.die) {
        this.push(text, 'dead'); text = '';
        const rv = this.die(e.end, e.final);
        if (rv) this.push(rv, 'tal');
        break;
      }
      if (e.choices) {
        this.pending = { text, choices: e.choices.map(c => c[0]), ids: e.choices.map(c => c[1]) };
        this.cur.pending = this.pending;
        return;
      }
      const nx = (e.then || []).find(([, c]) => !c || c(this));
      e = nx ? EVENTS_BY_ID[nx[0]] : null;
    }
    if (text) this.push(text);
  }

  choose(i) {
    const p = this.pending;
    if (!p) return null;
    const id = p.ids[i] != null ? p.ids[i] : p.ids[0];
    this.pending = null; this.cur.pending = null; this.choiceCount += 1;
    this.run(EVENTS_BY_ID[id], p.text);
    if (!this.pending) this.finish();
    return this.cur;
  }

  finish() {
    if (this.alive) this.ageing();
    if (this.alive && this.age >= AGE_CAP) { this.push('你活得太久，连时间都忘了你。', 'dead'); this.die('时间尽头', true); }
    if (this.alive && (this.age === 0 || this.age === 17)) this.snaps[this.age] = this.snap();
    if (this.skipYears) { this.age += this.skipYears; this.skipYears = 0; }
    this.cur.alive = this.alive;
  }

  ageing() {
    const ea = this.hAge - this.life;
    if (ea >= 50 && !this.tal('bulao') && !this.has('吸血鬼') && this.r(0.12)) this.chg({ CHR: -1 });
    if (ea >= 60 && this.r(this.tal('laojian') ? 0.1 : 0.2)) this.chg({ STR: -1 });
    if (ea >= 80 && this.r(this.tal('laojian') ? 0.1 : 0.2)) this.chg({ STR: -1 });

    let msg = null;
    if (this.STR < 0 && (this.age < 6 || this.r(0.4))) {
      msg = this.age < 1 ? '你没能熬过出生后的第一个冬天。'
        : this.hAge < 18 ? '你的身体太弱了，一场大病带走了你。'
        : '你的身体彻底垮了，再也没能好起来。';
    } else if (this.SPR <= -5 && this.age >= 15 && this.r(0.06)) {
      msg = '你积郁成疾，一病不起。';
    } else if (ea >= 65) {
      const p = Math.min(0.6, Math.max(0.004, (ea - 60 - this.STR * 1.5) * 0.012));
      if (this.r(p)) msg = this.deathText();
    }
    if (!msg) return;
    this.push(msg, 'dead');
    const rv = this.die('寿终');
    if (rv) this.push(rv, 'tal');
  }

  deathText() {
    if (this.species === '猫') return this.has('有主人') ? '你在主人怀里安静地闭上了眼睛。' : '你在一个暖洋洋的午后，在墙头上睡着了，再也没有醒来。';
    if (this.species === '熊猫') return '你在基地里安详离世，全网都在为你点蜡烛。';
    const opts = ['你在睡梦中安详地离开了人世。', '一个阳光很好的午后，你在躺椅上睡着了，再也没有醒来。'];
    if (this.has('修仙')) opts.push('你寿元耗尽，在洞府中坐化。', '你寿元耗尽，在洞府中坐化。');
    if (this.has('有孩子')) opts.push('你在儿孙的陪伴下走完了一生。', '你在儿孙的陪伴下走完了一生。');
    if (!this.has('已婚') && !this.has('有孩子') && this.SPR < 4) opts.push('你独自在家中去世，几天后才被邻居发现。');
    return pickOne(opts);
  }

  // 自动做选择（速通用）
  autoChoose() { if (this.pending) this.choose(Math.floor(Math.random() * this.pending.ids.length)); }

  summary() {
    const rows = KEYS5.map(k => ({ k, name: ATTR[k], v: this.max[k], ...rateAttr(this.max[k]) }));
    const ha = this.hAge;
    const ageR = rateAge(ha);
    const sum = KEYS5.reduce((a, k) => a + this.max[k], 0);
    const score = sum * 2 + Math.floor(Math.min(ha, 500) / 2);
    return { rows, ageR, score, hAge: ha, ...rateScore(score) };
  }
}

// 评级：tier 0地狱 1折磨 2不佳 3普通 4优秀 5罕见 6逆天
const TIER = ['地狱', '折磨', '不佳', '普通', '优秀', '罕见', '逆天'];
const tierBy = (v, cuts) => { let i = 0; while (i < cuts.length && v >= cuts[i]) i++; return { tier: i, label: TIER[i] }; };
const rateAttr = v => tierBy(v, [1, 3, 5, 7, 9, 11]);
const rateAge = a => tierBy(a, [1, 18, 40, 70, 90, 100]);
const rateScore = s => tierBy(s, [60, 80, 100, 120, 140, 170]);

// ===== 抽卡：惊喜天赋概率大幅提高，十连保底一个 =====
const ODDS = [0.40, 0.27, 0.13, 0.06, 0.14];
function drawTalents(achCount, inherit) {
  const b = Math.min(achCount, 50) * 0.002;
  const odds = [ODDS[0] - b, ODDS[1], ODDS[2], ODDS[3] + b / 2, ODDS[4] + b / 2];
  const hand = [];
  if (inherit && TMAP[inherit]) hand.push(inherit);
  let guard = 0;
  while (hand.length < 10 && guard++ < 500) {
    let x = Math.random(), g = 0;
    while (g < 4 && x >= odds[g]) { x -= odds[g]; g++; }
    const pool = TALENTS.filter(t => t.g === g && !hand.includes(t.id));
    if (pool.length) hand.push(pickOne(pool).id);
  }
  if (!hand.some(id => TMAP[id].g === 4)) {
    const pool = TALENTS.filter(t => t.g === 4 && !hand.includes(t.id));
    const slot = hand.findIndex((id, i) => TMAP[id].g === 0 && !(i === 0 && id === inherit));
    if (pool.length) hand[slot >= 0 ? slot : hand.length - 1] = pickOne(pool).id;
  }
  return hand;
}

function beep(freqs, dur = 0.07, type = 'square', gain = 0.035) {
  if (!SFX.on) return;
  try {
    SFX.ctx = SFX.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = SFX.ctx;
    let t = ctx.currentTime;
    for (const f of [].concat(freqs)) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + dur);
      t += dur * 0.85;
    }
  } catch (e) { /* 浏览器不支持音频时静默 */ }
}

(function stars() {
  const c = document.getElementById('stars');
  if (!c || !c.getContext) return;
  const ctx = c.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cols = ['#FFFFFF', '#FFFFFF', '#FFD15C', '#5AB8FF', '#B884FF'];
  let pts = [];
  const draw = t => {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of pts) {
      ctx.globalAlpha = reduce ? 0.7 : 0.25 + 0.75 * Math.abs(Math.sin(p.p + t / 1100));
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
  };
  const size = () => {
    c.width = Math.ceil(window.innerWidth / 3); c.height = Math.ceil(window.innerHeight / 3);
    pts = Array.from({ length: Math.round(c.width * c.height / 700) }, () => ({
      x: Math.floor(Math.random() * c.width), y: Math.floor(Math.random() * c.height),
      p: Math.random() * 6.28, s: Math.random() < 0.12 ? 2 : 1, c: pickOne(cols),
    }));
    draw(0);
  };
  size();
  window.addEventListener('resize', size);
  if (!reduce) setInterval(() => draw(performance.now()), 160);
})();

    return `<section class="screen">
      ${topbar()}
      <div><h2 class="h2">天赋十连抽</h2><p class="sub">选三个天赋带进这一世。每次十连至少出一个惊喜天赋，不满意还能重抽。</p></div>
      <div class="odds">${ODDS.map((p, g) => `<span style="--rc:var(--r${g})">${RARITY[g]} ${GRADE[g]} ${Math.round(p * 100)}%</span>`).join('')}</div>
      <div class="cards">${cards}</div>
      <div class="btn-row">
        ${G.drawn
          ? `<button class="btn btn-ghost" data-act="reroll" ${G.rerolls > 0 ? '' : 'disabled'}>重抽 ×${G.rerolls}</button>
             <button class="btn" data-act="toAlloc" ${G.sel.length === 3 ? '' : 'disabled'}>下一步（${G.sel.length}/3）</button>`
          : `<button class="btn" data-act="draw">▶ 十连抽</button>`}
      </div>
    </section>`;
  },

  alloc() {
    const left = totalPts() - usedPts();
    const rows = KEYS4.map(k => {
      const v = G.alloc[k], b = talBonus(k);
      return `<div class="arow" style="--ac:var(--a-${k})">
        <span class="an">${attrBadge(k)}${ATTR[k]}</span>
        <div class="cells" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i class="${i < v ? 'f' : ''}"></i>`).join('')}</div>
        <div class="stepper">
          <button data-act="dec" data-k="${k}" ${v <= 0 ? 'disabled' : ''} aria-label="${ATTR[k]}减一">−</button>
          <output>${v}${b ? `<small>${signed(b)}</small>` : ''}</output>
          <button data-act="inc" data-k="${k}" ${v >= 10 || left <= 0 ? 'disabled' : ''} aria-label="${ATTR[k]}加一">+</button>
        </div>
      </div>`;
    }).join('');
    return `<section class="screen">
      ${topbar()}
      <div><h2 class="h2">分配属性</h2><p class="sub">每项 0 到 10 点，绿色数字是天赋加成，快乐从 5 点起步。</p></div>
      <div class="picked">${G.sel.map(id => `<span class="pill" data-g="${TMAP[id].g}">${TMAP[id].n}</span>`).join('')}</div>
      <p class="points">剩余点数 <b>${left}</b><span class="sub">共 ${totalPts()} 点</span></p>
      <div class="alloc px">${rows}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" data-act="randAlloc">随机分配</button>
        <button class="btn" data-act="begin" ${left === 0 ? '' : 'disabled'}>▶ 开始新人生</button>
      </div>
    </section>`;
  },

  life() {
    const L = G.life;
    return `<section class="screen life">
      ${topbar(false)}
      <div class="hud px">
        <div class="hud-age"><b id="hud-age">${Math.max(L.age, 0)}</b><span id="hud-sp">${L.species === '人' ? '岁' : L.species + ' · 岁'}</span></div>
        <div class="attrs" id="attrs">${KEYS5.map(k => attrHTML(k, L[k])).join('')}</div>
      </div>
      <div class="logwrap" id="logwrap" data-act="next" title="点击推进一年">
        <div class="dialog px"><span class="dialog-tag">人生记录</span><ul class="log" id="log">${logHTML(L)}</ul></div>
      </div>
      <div class="controls" id="controls">${controlsHTML()}</div>
    </section>`;
  },

  summary() {
    const L = G.life, S = L.summary();
    const kws = Object.keys(KEYWORDS).filter(k => L.ever.has(k)).map(k => KEYWORDS[k]);
    const rate = (color, ch, name, v, max, r) => `<div class="rate" style="--ac:${color}">
      <span class="an">${badge(color, ch)}${name}</span>
      <div class="meter"><i style="width:${pct(v, max)}%"></i></div>
      <span class="v">${v}</span><span class="tier" data-t="${r.tier}">${r.label}</span>
    </div>`;
    return `<section class="screen">
      ${topbar()}
      <h2 class="h2">人生结算</h2>
      <div class="result px">
        <div class="rank" data-t="${S.tier}"><div style="display:grid;justify-items:center"><b>${RANK[S.tier]}</b><small>${S.label}</small></div></div>
        <div>
          <span class="label">第 ${meta.lives} 世</span>
          <p class="big">${lifeTitle(L)}</p>
          <span class="score">SCORE ${S.score}</span>
          <p class="epi">${deathLine(L)}</p>
        </div>
      </div>
      <div class="rates px">
        ${S.rows.map(r => rate(`var(--a-${r.k})`, BADGE[r.k], r.name, r.v, 12, r)).join('')}
        ${rate('var(--orange)', '寿', '寿命', S.hAge, 100, S.ageR)}
      </div>
      <p class="sub">各项按一生中的最高值评级。总分 = 五项最高值之和 × 2 + 寿命 ÷ 2。</p>
      ${kws.length ? `<div class="section"><span class="label">人生关键词</span><div class="picked">${kws.map(k => `<span class="pill">${k}</span>`).join('')}</div></div>` : ''}
      ${G.newAch.length ? `<div class="section"><span class="label">成就解锁</span><div class="unlock">${G.newAch.map(a => `<span class="pill" title="${a.d}">★ ${a.n}</span>`).join('')}</div></div>` : ''}
      <div class="section inherit">
        <span class="label">选一个天赋带进下一世</span>
        <div class="cards">${L.talents.map(t => cardHTML(t.id, { act: 'inherit', on: meta.inherit === t.id })).join('')}</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" data-act="showLog">回看这一世</button>
        <button class="btn btn-ghost" data-act="share">复制结局</button>
        <button class="btn" data-act="start">▶ 再活一次</button>
      </div>
    </section>`;
  },
};

function controlsHTML() {
  if (!G.life.alive) return `<button class="btn" data-act="toSummary">▶ 人生结算</button>`;
  return `<button class="btn" data-act="next">下一年</button>
    <button class="btn btn-ghost" data-act="auto" aria-pressed="${G.auto}">${G.auto ? '暂停' : '自动'}</button>
    <button class="btn btn-ghost" data-act="finish">速通</button>`;
}

function render() {
  $app.innerHTML = SCREENS[G.screen]();
  if (G.screen === 'life') scrollLog();
  renderOverlay();
}

// ---------- 弹层 ----------
function renderOverlay() {
  document.querySelector('.overlay')?.remove();
  if (!G.overlay) return;
  const el = document.createElement('div');
  el.className = 'overlay'; el.dataset.act = 'closeOverlay';
  let body = '';
  if (G.overlay === 'ach') {
    body = `<div class="panel-head"><h2 class="h2">成就</h2><span class="sub">已解锁 ${meta.ach.length}/${ACH.length}。每解锁一个，抽到高品级天赋的概率略微提升。</span></div>
      <div class="ach-grid">${ACH.map(a => meta.ach.includes(a.id)
        ? `<div class="ach got"><b>★ ${a.n}</b><span>${a.d}</span></div>`
        : `<div class="ach lock"><b>？？？</b><span>${a.d}</span></div>`).join('')}</div>`;
  } else if (G.overlay === 'hist') {
    body = `<div class="panel-head"><h2 class="h2">轮回档案</h2><span class="sub">最近 ${meta.hist.length} 世</span></div>
      ${meta.hist.length ? `<ul class="hist">${meta.hist.map(h => `<li><b>第 ${h.n} 世 · ${h.title}</b><span class="tier" data-t="${h.tier}">${RANK[h.tier]} ${h.score}</span><small>${h.tals.join('、')} — ${h.epi}</small></li>`).join('')}</ul>`
        : '<p class="empty">还没有完成过任何一世。</p>'}`;
  } else if (G.overlay === 'share') {
    body = `<div class="panel-head"><h2 class="h2">复制结局</h2><span class="sub">这里没法自动复制，请长按或拖选下面的文字。</span></div>
      <textarea id="share-text" class="share-box" readonly rows="7">${shareText()}</textarea>`;
  } else if (G.overlay === 'log') {
    body = `<div class="panel-head"><h2 class="h2">这一世</h2></div>
      <div class="dialog"><ul class="log">${G.life.history.map(y => yearHTML(y)).join('')}</ul></div>`;
  }
  el.innerHTML = `<div class="panel px" role="dialog" aria-modal="true">${body}<div class="btn-row"><button class="btn btn-ghost" data-act="closeOverlay">关闭</button></div></div>`;
  document.body.appendChild(el);
}

// ---------- 人生推进 ----------
function scrollLog() {
  const w = document.getElementById('logwrap');
  if (w) w.scrollTop = w.scrollHeight;
}
function updateAttrs(delta) {
  const L = G.life;
  const ageEl = document.getElementById('hud-age');
  if (ageEl) ageEl.textContent = Math.max(L.age, 0);
  const spEl = document.getElementById('hud-sp');
  if (spEl) spEl.textContent = L.species === '人' ? '岁' : L.species + ' · 岁';
  KEYS5.forEach(k => {
    const box = document.querySelector(`.attr[data-k="${k}"]`);
    if (!box) return;
    box.querySelector('b').textContent = L[k];
    box.querySelector('.meter i').style.width = pct(L[k], 12) + '%';
    const d = delta && delta[k];
    box.querySelector('em')?.remove();
    if (d) box.insertAdjacentHTML('beforeend', `<em class="${d > 0 ? 'u' : 'd'}">${signed(d)}</em>`);
  });
}
function appendYear(yr) {
  const log = document.getElementById('log');
  log.querySelector('li.cur')?.classList.remove('cur');
  log.insertAdjacentHTML('beforeend', yearHTML(yr, 'new cur'));
}
function stepOnce() {
  const L = G.life;
  if (!L || !L.alive || L.pending) return;
  const yr = L.step();
  appendYear(yr);
  updateAttrs(yr.delta);
  scrollLog();
  if (yr.pending) sfx.choice();
  else if (L.alive) sfx.step();
  if (!L.alive) onDeath();
}
function chooseOption(i) {
  const L = G.life;
  if (!L || !L.pending) return;
  sfx.pick();
  const yr = L.choose(i);
  document.getElementById('log').lastElementChild.outerHTML = yearHTML(yr, 'cur');
  updateAttrs(yr.delta);
  scrollLog();
  if (!L.alive) onDeath();
}
function stopAuto() { clearInterval(G.timer); G.timer = null; G.auto = false; }
function onDeath() {
  stopAuto();
  const L = G.life, S = L.summary();
  meta.lives += 1;
  meta.best = Math.max(meta.best, S.score);
  G.newAch = ACH.filter(a => !meta.ach.includes(a.id) && (() => { try { return a.c(L, meta); } catch (e) { return false; } })());
  meta.ach.push(...G.newAch.map(a => a.id));
  meta.hist.unshift({ n: meta.lives, title: lifeTitle(L), score: S.score, tier: S.tier, label: S.label, epi: deathLine(L), tals: L.talents.map(t => t.n) });
  meta.hist = meta.hist.slice(0, 20);
  meta.inherit = null;
  saveMeta();
  document.getElementById('controls').innerHTML = controlsHTML();
  sfx.death();
  if (G.newAch.length) setTimeout(() => { sfx.ach(); toast(`★ 成就解锁：${G.newAch.map(a => a.n).join('、')}`); }, 700);
}

// ---------- 交互 ----------
const ACT = {
  home() { stopAuto(); G.screen = 'home'; G.overlay = null; render(); },
  start() {
    stopAuto();
    Object.assign(G, { screen: 'talent', hand: [], drawn: false, sel: [], alloc: { CHR: 0, INT: 0, STR: 0, MNY: 0 }, life: null, newAch: [], overlay: null, rerolls: 2 });
    render(); window.scrollTo(0, 0);
  },
  draw() {
    G.inheritId = meta.inherit;
    G.hand = drawTalents(meta.ach.length, meta.inherit);
    G.drawn = true; G.justDrew = true;
    meta.seenT = [...new Set([...meta.seenT, ...G.hand])];
    saveMeta();
    render();
    if (G.hand.some(id => TMAP[id].g >= 3)) sfx.rare(); else sfx.draw();
  },
  reroll() {
    if (G.rerolls <= 0) return;
    G.rerolls -= 1;
    G.hand = drawTalents(meta.ach.length, G.inheritId);
    G.sel = []; G.justDrew = true;
    meta.seenT = [...new Set([...meta.seenT, ...G.hand])];
    saveMeta(); render();
    if (G.hand.some(id => TMAP[id].g >= 3)) sfx.rare(); else sfx.draw();
  },
  pick(b) {
    const id = b.dataset.id;
    if (G.sel.includes(id)) G.sel = G.sel.filter(x => x !== id);
    else if (G.sel.length >= 3) { sfx.no(); return toast('最多只能选三个天赋'); }
    else {
      const c = conflict(G.sel, id);
      if (c) { sfx.no(); return toast(`「${TMAP[id].n}」和「${TMAP[c].n}」不能同时选择`); }
      G.sel.push(id);
    }
    sfx.pick();
    render();
  },
  toAlloc() { if (G.sel.length === 3) { G.screen = 'alloc'; render(); window.scrollTo(0, 0); } },
  inc(b) { const k = b.dataset.k; if (G.alloc[k] < 10 && usedPts() < totalPts()) { G.alloc[k]++; render(); } },
  dec(b) { const k = b.dataset.k; if (G.alloc[k] > 0) { G.alloc[k]--; render(); } },
  randAlloc() {
    const a = { CHR: 0, INT: 0, STR: 0, MNY: 0 };
    let n = Math.min(totalPts(), 40);
    while (n > 0) { const k = pickOne(KEYS4); if (a[k] < 10) { a[k]++; n--; } }
    G.alloc = a; render();
  },
  begin() {
    if (usedPts() !== totalPts()) return;
    G.life = new Life(G.sel, G.alloc);
    G.screen = 'life'; render();
    stepOnce();
  },
  next() {
    if (G.life && G.life.pending) { sfx.no(); return toast('先做出你的选择'); }
    if (!G.auto) stepOnce();
  },
  auto() {
    if (G.auto) stopAuto();
    else { G.auto = true; G.timer = setInterval(stepOnce, 450); }
    if (G.life.alive) document.getElementById('controls').innerHTML = controlsHTML();
  },
  finish() {
    stopAuto();
    const L = G.life;
    let guard = 0;
    while (L.alive && guard++ < 5000) { if (L.pending) L.autoChoose(); else L.step(); }
    document.getElementById('log').innerHTML = logHTML(L);
    updateAttrs(null); scrollLog(); onDeath();
  },
  choose(b) { chooseOption(+b.dataset.i); },
  toSummary() { G.screen = 'summary'; render(); window.scrollTo(0, 0); },
  inherit(b) {
    const id = b.dataset.id;
    meta.inherit = meta.inherit === id ? null : id; saveMeta();
    render();
    if (meta.inherit) toast(`下一世会带着「${TMAP[id].n}」出生`);
  },
  share() {
    const text = shareText();
    const done = () => toast('结局已复制，可以直接粘贴分享');
    const fallback = () => { G.overlay = 'share'; renderOverlay(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (err) { fallback(); }
  },
  sfx() {
    SFX.on = !SFX.on; store.set('sfx', SFX.on);
    document.querySelectorAll('[data-act="sfx"]').forEach(b => { b.setAttribute('aria-pressed', SFX.on); b.innerHTML = `音效 <b>${SFX.on ? '开' : '关'}</b>`; });
  },
  showAch() { G.overlay = 'ach'; renderOverlay(); },
  showHist() { G.overlay = 'hist'; renderOverlay(); },
  showLog() { G.overlay = 'log'; renderOverlay(); },
  closeOverlay(b, e) { if (e.target === b) { G.overlay = null; renderOverlay(); } },
};
const OWN_SOUND = new Set(['draw', 'reroll', 'pick', 'next', 'choose', 'finish', 'begin', 'closeOverlay']);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (!OWN_SOUND.has(act)) sfx.click();
  const fn = ACT[act];
  if (fn) fn(b, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && G.overlay) { G.overlay = null; renderOverlay(); return; }
  if (G.screen === 'life' && !G.overlay && (e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) {
    e.preventDefault(); ACT.next();
  }
});

render();
</script>
</body>
</html>
